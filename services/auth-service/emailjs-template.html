<!--
  The email template for EmailJS (Email Templates → Content, code mode).

  Template fields in the EmailJS dashboard:
    To email:    {{to_email}}
    Subject:     {{subject}}
    From name:   notio
    Reply email: (your address, or empty)

  Variables the auth-service passes in:
    {{to_email}}   — the recipient (already filled into the To field)
    {{subject}}    — the subject line (already filled into the Subject field)
    {{message}}    — the lead line: email confirmation or password reset
    {{action_url}} — the action link (the button and the fallback text)

  One template serves both letters: email confirmation and password reset
  differ only by the {{subject}} and {{message}} values sent in the params.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{subject}}</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f4f5">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f4f4f5; padding: 32px 12px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="480"
            cellpadding="0"
            cellspacing="0"
            style="
              width: 480px;
              max-width: 100%;
              background-color: #ffffff;
              border-radius: 12px;
              padding: 36px 32px;
              font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
              color: #18181b;
            "
          >
            <tr>
              <td style="font-size: 20px; font-weight: 600; padding-bottom: 16px">notio</td>
            </tr>
            <tr>
              <td style="font-size: 15px; line-height: 1.6; padding-bottom: 24px">
                {{message}}
              </td>
            </tr>
            <tr>
              <td>
                <a
                  href="{{action_url}}"
                  style="
                    display: inline-block;
                    background-color: #18181b;
                    color: #ffffff;
                    text-decoration: none;
                    font-size: 15px;
                    font-weight: 500;
                    padding: 12px 24px;
                    border-radius: 8px;
                  "
                  >Continue</a
                >
              </td>
            </tr>
            <tr>
              <td style="font-size: 13px; line-height: 1.6; color: #71717a; padding-top: 24px">
                If the button does not work, open the link manually:<br />
                <a href="{{action_url}}" style="color: #18181b; word-break: break-all">{{
                  action_url
                }}</a>
              </td>
            </tr>
            <tr>
              <td style="font-size: 12px; color: #a1a1aa; padding-top: 24px">
                If you did not request this email, simply ignore it — your password and access
                will stay unchanged.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
